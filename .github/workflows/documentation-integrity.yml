name: Documentation integrity

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.md"
      - "scripts/validate_docs.py"
      - ".github/workflows/documentation-integrity.yml"
  push:
    branches:
      - main
      - "docs/**"
    paths:
      - "**/*.md"
      - "scripts/validate_docs.py"
      - ".github/workflows/documentation-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  documentation-integrity:
    name: Documentation integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record tested revision
        run: echo "Tested source revision: $(git rev-parse HEAD)"
      - name: Validate documentation
        run: python3 scripts/validate_docs.py
