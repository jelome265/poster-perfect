name: Application quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-quality:
    name: Strict lint, type check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Strict lint (warnings fail the build)
        run: npm run lint

      - name: Type check (strict TypeScript)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Production preview HTTP and asset smoke
        shell: bash
        run: |
          set -euo pipefail
          preview_log="${RUNNER_TEMP}/poster-perfect-preview.log"
          preview_html="${RUNNER_TEMP}/poster-perfect-preview.html"

          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort >"$preview_log" 2>&1 &
          preview_pid=$!
          cleanup() {
            kill "$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent "http://127.0.0.1:4173/" --output "$preview_html"; then
              ready=1
              break
            fi
            sleep 0.5
          done

          if [ "$ready" -ne 1 ]; then
            cat "$preview_log"
            exit 1
          fi

          grep --quiet 'id="root"' "$preview_html"
          asset_paths="$(grep -oE '(src|href)="/assets/[^\"]+"' "$preview_html" | cut -d '"' -f 2)"
          if [ -z "$asset_paths" ]; then
            echo "No built JavaScript or stylesheet assets were referenced by the preview document."
            cat "$preview_html"
            exit 1
          fi
          has_js=0
          while IFS= read -r asset_path; do
            [ -z "$asset_path" ] && continue
            case "$asset_path" in
              *.js) has_js=1 ;;
            esac
            curl --fail --silent --show-error "http://127.0.0.1:4173${asset_path}" --output /dev/null
          done <<< "$asset_paths"

          if [ "$has_js" -ne 1 ]; then
            echo "The preview document did not reference a built JavaScript asset."
            exit 1
          fi

